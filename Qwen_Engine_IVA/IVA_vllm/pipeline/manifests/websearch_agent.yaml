name: websearch_agent
description: "PubMed + bioRxiv/medRxiv (via Crossref) literature search for genes absent from GeneReviews, OMIM, MedGen and CGD; forced ClinVar submission-level check for P/LP variants."
enabled: true

order: 3
parallel: false

# No manifest gate — run() itself decides: literature search only when every
# curated source is empty for the gene. Order 3 so genereviews (order 1) has
# already filled its class-level cache.

compress:
  enabled: true
  threshold: 20
  strategy: slm
  max_tokens: 600

# Up to ~6 NCBI/Crossref calls + ~5 SLM calls on a gene's first variant
timeout: 120
retry:
  attempts: 1
  backoff: 0.0
