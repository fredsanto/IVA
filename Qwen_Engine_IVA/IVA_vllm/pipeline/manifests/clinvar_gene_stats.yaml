name: clinvar_gene_stats
description: "Fetches gene-level ClinVar P/LP counts split by missense vs. nonsense/frameshift, for PP2/BP1."
enabled: true

# order 2 (not 1): run() now prefers ClinGenAlleleTool's already-resolved
# ClinVar variation ID (via context.all_outputs["clingen_allele"]) over its
# own weaker HGVS-only resolution — clingen_allele.py is order 1 and must
# have fully completed before this tool reads its output, or the lookup
# silently misses cases clingen_allele would have caught (see the note in
# clinvar_gene_stats.py's run() for the RYR1/HGVS="NA" case this fixes).
order: 2
parallel: true

gate:
  field: Gene
  operator: not_na

timeout: 15
retry:
  attempts: 2
  backoff: 2.0
