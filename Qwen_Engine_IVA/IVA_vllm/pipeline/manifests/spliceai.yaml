name: spliceai
description: "Fetches SpliceAI delta scores from the Broad Institute API for splice impact prediction."
enabled: true

order: 1
parallel: true

# Python gate() runs first; this manifest gate is only reached if Python gate passes.
# Checks the canonical (SLM-mapped) field, not a hardcoded raw column name —
# whatever the input CSV called its precomputed SpliceAI column (SpliceAI_v13,
# spliceai_concat, ...), the header-interpretation SLM maps it to SpliceAI_score
# if it recognizes it. Skip the live API call when that's already populated.
gate:
  field: SpliceAI_score
  operator: na

compress:
  enabled: true
  threshold: 20
  strategy: slm
  max_tokens: 350

timeout: 60
retry:
  attempts: 2
  backoff: 3.0
